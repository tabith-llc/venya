repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        always_run: true
        pass_filenames: false
        args: ["-r", "packages/", "-x", "packages/executor/tests/,packages/server/tests/,packages/core/tests/"]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock (check)
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: "^pyproject\\.toml$"

      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        files: "^packages/.*pyproject\\.toml$"
