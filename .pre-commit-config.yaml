repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        always_run: true
        pass_filenames: false
        args: ["-r", "packages/", "-x", "packages/executor/tests/,packages/server/tests/,packages/core/tests/,packages/mcp/tests/,packages/cli/tests/,packages/executor/.venv"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".detect-secrets-baseline", "--exclude-files", "target/"]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock (check)
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: "^pyproject\\.toml$"

      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        files: "^packages/.*pyproject\\.toml$"

      - id: mypy
        name: mypy (5 packages, src only)
        entry: uvx mypy@2.3.1 --no-error-summary packages/core/src packages/server/src packages/executor/src packages/mcp/src packages/cli/src
        language: system
        pass_filenames: false
        files: "^packages/.*/src/"
