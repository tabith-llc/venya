repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        always_run: true
        pass_filenames: false
        args: ["-r", "packages/", "-x", "packages/executor/tests/,packages/server/tests/,packages/core/tests/,packages/mcp/tests/,packages/cli/tests/,packages/venya-contract/tests/,packages/executor/.venv"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".detect-secrets-baseline", "--exclude-files", "target/", "--exclude-files", "\\.detect-secrets-baseline$"]
        # Refs #550: count this baseline by JSON parsing, never by grepping it — the
        # scan's is_baseline_file filter records the baseline's own filename inside
        # filters_used, so the document references itself and a document-wide
        # "filename" token grep over-counts by one. The read-only method lives in
        # scripts/detect_secrets_baseline_stats.py.

  - repo: local
    hooks:
      # Refs #546: the detect-secrets hook above rewrites .detect-secrets-baseline
      # mid-commit and asks the committer to stage it, so a vanished detection can
      # otherwise ship quietly. One implementation, two thin entries (R9.1): the
      # default stage cannot see the commit message, so it fails on any vanish; the
      # commit-msg stage is where a declared removal (Baseline-removal-reason) is
      # honoured. The core interlock stays the enforcement; this chain is the early
      # and kindly catch.
      - id: baseline-shrink-guard
        name: detect-secrets baseline shrink guard
        entry: python3 scripts/detect_secrets_baseline_guard.py --stage pre-commit
        language: system
        pass_filenames: false
        always_run: true

      - id: baseline-shrink-guard-message
        name: detect-secrets baseline removal declared?
        entry: python3 scripts/detect_secrets_baseline_guard.py --stage commit-msg
        language: system
        stages: [commit-msg]

      # Refs #447: the httpx2 cap is a workspace-wide ruling, but only this census can see all
      # five declaring members. It sits BEFORE the lock-comparing hooks on purpose: a cap-stripped
      # member manifest would otherwise meet `requirements-pinned`/`pip-audit` first, and their own
      # dictated remedy (`uv lock`) quiets both while leaving the uncapped declaration in place —
      # this census is stdlib-only (`tomllib` + `pathlib`), never invokes `uv`, and cannot re-lock
      # (the #627 class). The same rule has a second door: packages/cli/tests/
      # test_httpx2_upper_bound_447.py imports this script, which is what covers `--no-verify`
      # and a fresh clone with no hooks installed (measured: 0 non-sample hooks).
      - id: httpx2-bound-census
        name: httpx2 bound census (workspace-wide, #447)
        entry: python3 scripts/check_httpx2_bound_census.py
        language: system
        pass_filenames: false
        files: "^packages/[^/]+/pyproject\\.toml$"

      - id: uv-lock
        name: uv-lock (check)
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: "^pyproject\\.toml$"

      - id: requirements-pinned
        name: requirements pinned to uv.lock
        entry: scripts/pin-requirements.sh --check
        language: system
        pass_filenames: false
        files: "^(uv\\.lock|venya-(core|executor)-requirements\\.txt|pyproject\\.toml|packages/[^/]+/pyproject\\.toml)$"

      # Refs #627: `uv run` syncs the project environment, and that sync REWRITES the
      # tracked uv.lock whenever the lock disagrees with a just-edited
      # packages/*/pyproject.toml — which is exactly what this hook's `files:` pattern
      # fires on. The chain therefore mutated tracked state mid-commit (revision 3 -> 5
      # plus version lines, 16 lines nobody chose) while pip-audit itself reported "No
      # known vulnerabilities found", so the failure text pointed at the hook instead of
      # at the lockfile decision the committer had to own. `--locked` keeps the audit
      # question identical and makes uv refuse to write: a stale lock now fails the
      # commit with "run `uv lock`" instead of silently landing a re-lock. Enforcement
      # of the assertion itself is packages/core/tests/test_pip_audit_hook_lock_safety_627.py.
      - id: pip-audit
        name: pip-audit (dependency CVEs, OSV feed)
        entry: uv run --locked pip-audit --vulnerability-service osv
        language: system
        pass_filenames: false
        files: "^packages/.*pyproject\\.toml$"

      - id: mypy
        name: mypy (6 packages, src only)
        entry: uvx mypy@2.3.1 --no-error-summary packages/core/src packages/server/src packages/executor/src packages/mcp/src packages/cli/src packages/venya-contract/src
        language: system
        pass_filenames: false
        files: "^packages/.*/src/"
