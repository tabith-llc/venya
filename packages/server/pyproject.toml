[project]
name = "server"
version = "0.1.0"
description = "FastAPI server: WebAuthn, REST API"
requires-python = ">=3.13"
dependencies = [
    "vault",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "fido2>=1.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=43.0.0",
    "httpx2>=0.27.0",
    "websockets>=13.0",
]

[project.scripts]
venya-server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
