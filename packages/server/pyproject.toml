[project]
name = "server"
version = "0.1.0"
description = "FastAPI server: WebAuthn, REST API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "fido2>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=50.0.0",
    "httpx2>=0.27.0",
    "websockets>=13.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
venya-server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]
