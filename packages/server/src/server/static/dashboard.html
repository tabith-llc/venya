<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venya - Dashboard</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav">
        <a href="#dashboard" id="nav-secrets">Secrets</a>
        <a href="#audit" id="nav-audit">Audit Log</a>
    </nav>
    <div id="app">
        <section id="dashboard-section">
            <h1>Secrets</h1>
            <button id="store-secret-btn">Store Secret</button>
            <table id="secrets-table">
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Roles</th>
                        <th>Value</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="secrets-tbody"></tbody>
            </table>
        </section>
        <section id="audit-section" hidden>
            <h1>Audit Log</h1>
            <div id="audit-filters">
                <label for="filter-user">User</label>
                <select id="filter-user"><option value="">All</option></select>
                <label for="filter-key">Key</label>
                <input type="text" id="filter-key" placeholder="Secret key">
                <label for="filter-start-date">From</label>
                <input type="date" id="filter-start-date">
                <label for="filter-end-date">To</label>
                <input type="date" id="filter-end-date">
                <button id="export-csv-btn">Export CSV</button>
            </div>
            <table id="audit-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Event</th>
                        <th>User</th>
                        <th>Key</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="audit-tbody"></tbody>
            </table>
        </section>
        <div id="modal-overlay" class="modal-overlay" hidden>
            <div id="modal-content" class="modal"></div>
        </div>
    </div>
    <script src="/static/js/webauthn.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/secrets.js"></script>
    <script src="/static/js/audit.js"></script>
</body>
</html>
