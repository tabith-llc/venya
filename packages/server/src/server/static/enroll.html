<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venya - Enrollment</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div id="app">
        <h1>Enroll Your Security Key</h1>
        <form id="enroll-form">
            <label for="token">Enrollment Token</label>
            <input type="text" id="token" name="token" autocomplete="off" placeholder="Paste your enrollment token">
            <button type="submit" id="enroll-btn">Enroll</button>
        </form>
        <div id="message" class="message" hidden></div>
    </div>
    <script src="/static/js/webauthn.min.js"></script>
    <script src="/static/js/enroll.js"></script>
</body>
</html>
