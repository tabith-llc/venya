<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venya - My Credentials</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav id="nav">
        <a href="/dashboard#dashboard" id="nav-secrets">Secrets</a>
        <a href="/dashboard#audit" id="nav-audit">Audit Log</a>
        <a href="/admin/users" id="nav-users">Users</a>
        <a href="/admin/tokens" id="nav-tokens">Tokens</a>
        <a href="/admin/roles" id="nav-roles">Roles</a>
        <a href="/credentials" id="nav-credentials">Credentials</a>
        <button id="theme-toggle" class="nav-theme-toggle" title="Toggle dark mode">&#9683;</button>
        <button id="logout-btn" class="nav-logout">Logout</button>
    </nav>
    <div id="app">
        <h1>My Credentials</h1>
        <button id="add-credential-btn" class="btn-primary">Add Credential</button>
        <table id="credentials-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Label</th>
                    <th>Created</th>
                    <th>Last Used</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="credentials-tbody"></tbody>
        </table>
        <div id="empty-state" class="empty-state" hidden>
            <p>No credentials found.</p>
        </div>
        <div id="loading-state" class="loading-state" hidden>
            <p>Loading credentials...</p>
        </div>
        <div id="last-key-warning" class="message message-error" hidden>
            Cannot remove your last credential. Add a new one first.
        </div>
    </div>

    <!-- Add Credential Modal -->
    <div id="add-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 class="modal-title">Add Credential</h2>
            <form id="add-credential-form">
                <label>
                    Label
                    <input type="text" id="add-label" required placeholder="e.g. Backup key" autocomplete="off">
                </label>
                <div id="add-error" class="message-error" hidden></div>
                <div class="modal-buttons">
                    <button type="button" id="add-cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" id="add-submit-btn" class="btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Remove Confirmation Modal -->
    <div id="remove-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 class="modal-title">Remove Credential</h2>
            <div id="remove-content">
                <p>Remove credential <strong id="remove-label"></strong>?</p>
                <div id="remove-error" class="message-error" hidden></div>
            </div>
            <div class="modal-buttons">
                <button type="button" id="remove-cancel-btn" class="btn-secondary">Cancel</button>
                <button type="button" id="remove-confirm-btn" class="btn-delete">Remove</button>
            </div>
        </div>
    </div>

    <script src="/static/js/webauthn.min.js?v=2"></script>
    <script src="/static/js/credentials.js?v=1"></script>
</body>
</html>
