<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venya - Login</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div id="app">
        <h1>Venya</h1>
        <form id="login-form">
            <label for="user_id">User ID</label>
            <input type="text" id="user_id" name="user_id" autocomplete="username" placeholder="Enter your user ID">
            <button type="submit" id="login-btn">Login</button>
        </form>
        <div id="message" class="message" hidden></div>
    </div>
    <script src="/static/js/webauthn.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
