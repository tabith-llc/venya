<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venya - Login</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div id="app">
        <h1>Login</h1>
        <form id="login-form">
            <label>
                Username
                <input type="text" id="username" autocomplete="off" spellcheck="false" required>
            </label>
            <button type="submit" id="login-btn">Login</button>
        </form>
        <div id="message" class="message" hidden></div>
    </div>
    <script src="/static/js/webauthn.min.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
