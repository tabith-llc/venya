[project]
name = "venya-vault"
version = "0.1.0"
description = "Core vault library: RBAC, encryption, IAM, CLI"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "sqlalchemy>=2.0.0",
    "sqlcipher3>=0.6.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
]

[project.scripts]
venya = "venya.cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/venya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
