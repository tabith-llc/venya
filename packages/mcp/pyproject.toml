[project]
name = "venya-mcp"
version = "0.1.0"
description = "Venya MCP server — lets an LLM drive Venya via MCP tools"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx2>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
venya-mcp = "venya_mcp.server:main"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venya_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
