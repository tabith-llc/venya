[project]
name = "executor"
version = "0.1.0"
description = "Venya jump host executor daemon and credential injector"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "cryptography>=50.0.0",
    "httpx2>=0.27.0",
    "websockets",
    "pydantic",
    "pydantic-settings",
    "tomli-w",
]

[project.scripts]
venya-executor = "executor.daemon:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68.0", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-rust]
packages = ["venya_filter"]
binding-rustc-flags = ["-Cstrip=debuginfo"]

[tool.ruff]
target-version = "py313"
line-length = 120

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
