[project]
name = "venya-executor"
version = "0.1.0"
description = "Venya jump host executor daemon and credential injector"
requires-python = ">=3.13"
dependencies = [
    "venya-vault",
    "cryptography",
    "httpx",
    "websockets",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
venya-executor = "venya_executor.daemon:main"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py313"
line-length = 120
