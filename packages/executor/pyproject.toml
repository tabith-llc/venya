[project]
name = "executor"
version = "0.1.0"
description = "Venya jump host executor daemon and credential injector"
requires-python = ">=3.13"
dependencies = [
    "vault",
    "cryptography",
    "httpx",
    "websockets",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
venya-executor = "executor.daemon:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68.0", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-rust]
packages = ["venya_filter"]
binding-rustc-flags = ["-Cstrip=debuginfo"]

[[tool.setuptools-rust.rust-modules]]
package = "venya-filter"
source = "Cargo.toml"
extra-rustc-args = ["-C", "lto"]

[tool.ruff]
target-version = "py313"
line-length = 120
