[project]
name = "executor"
version = "0.1.0alpha13"
description = "Venya jump host executor daemon and credential injector"
requires-python = ">=3.14,<3.15"
dependencies = [
    "core",
    "venya-contract",
    "cryptography>=50.0.0",
    "httpx2>=0.27.0",
    "websockets",
    "pydantic",
    "pydantic-settings",
    "tomli-w",
]

[project.scripts]
venya-executor = "executor.daemon:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68.0", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-rust]
bind = "PyO3"
binding-rustc-flags = ["-Cstrip=debuginfo"]
strip = "debuginfo"

[[tool.setuptools-rust.rust_extensions]]
package = "."

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# Mirror of root [tool.ruff.lint] extend-ignore (ruff uses nearest config).
# B008 is per-file-ignored at the root (server FastAPI DI idiom only) — executor
# has no B008 sites, so this only mirrors BLE001 (tracked debt) + SIM117.
extend-ignore = ["BLE001", "SIM117"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
