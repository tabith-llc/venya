[project]
name = "venya-executor"
version = "0.1.0"
description = "Venya jump host executor daemon and credential injector"
requires-python = ">=3.13"
dependencies = [
    "venya-vault",
    "cryptography",
    "httpx",
    "websockets",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
venya-executor = "venya_executor.daemon:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.setuptools.ext-modules]]
name = "venya_executor._venya_filter"
sources = ["src/venya_executor/_source/venya_filter.c"]
extra-link-args = ["-lcrypto"]

[tool.ruff]
target-version = "py313"
line-length = 120
