[project]
name = "core"
version = "0.1.0"
description = "Venya core library: RBAC, encryption, IAM, CLI"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.0",
    "argon2-cffi>=23.1.0",
    "pycryptodome>=3.20.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "fido2>=2.0.0",
    "httpx2>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[project.optional-dependencies]
test = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
