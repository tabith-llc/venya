[project]
name = "venya"
version = "0.1.0"
description = "A secrets broker system for LLMs"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
venya-vault = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/vault/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120
