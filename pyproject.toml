[project]
name = "venya"
version = "0.1.0"
description = "A secrets broker system for LLMs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "server",
    "executor",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
core = { workspace = true }
server = { workspace = true }
executor = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
